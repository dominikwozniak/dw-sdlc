name: Feature request
description: A guard, a skill, a command or a config key that is not there yet.
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched the open and closed issues and found no duplicate.
          required: true
        - label: I read [`GLOSSARY.md`](https://github.com/dominikwozniak/dw-sdlc/blob/main/GLOSSARY.md) and use its words for what I am describing.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong in a session today, or what you do by hand instead.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would have it do
      description: The command and its output, or the guard and what it decides. A sketch of the terminal is worth more than a paragraph.
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: What shape is it
      options:
        - A guard, or a change to what one refuses
        - A skill, or a change to one
        - A dw-sdlc command or flag
        - A config key
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you tried
      description: Other shapes you considered, or the workaround you run today.
    validations:
      required: false
