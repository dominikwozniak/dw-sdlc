name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"

jobs:
  check:
    name: Check
    # A draft runs nothing: the Ship script marks it ready after its Review, and `ready_for_review`
    # runs the gate on that head. A squash merge lands on `main` with `(#NN)` in its subject; its pull
    # request already ran this gate against the merge with `main` as it stood at that run. Any other
    # push to `main` runs.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')) }}
    runs-on: ubuntu-latest
    # About twice a green run: tests growing back past it fail the job before they eat the minutes.
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check --verbose
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
